version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    target-branch: development
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Prague
    target-branch: development
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Prague
    target-branch: development
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/opentofu
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Prague
    target-branch: development
    groups:
      infrastructure:
        patterns: ["*"]
