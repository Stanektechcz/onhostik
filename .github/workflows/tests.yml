name: tests

# The Pest suite (feature, contract and unit tests) on every push and pull request.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, sodium
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: touch .env   # phpunit.xml carries the test environment; the staging template is checked by EnvTemplateTest, not used

      - name: Code style
        run: vendor/bin/pint --test

      - name: Pest
        run: php artisan test --compact

      - name: Static analysis (Larastan level 5, baseline = typing debt; new code must pass)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Dependency audit
        run: composer audit --no-interaction

  # The same suite against PostgreSQL 16 — the production database (go-live checklist §1); SQLite habits fail here first.
  pest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onhost_test
          POSTGRES_USER: onhost
          POSTGRES_PASSWORD: onhost
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: onhost_test
      DB_USERNAME: onhost
      DB_PASSWORD: onhost
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pgsql, pdo_pgsql, gd, bcmath, sodium
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: touch .env

      - name: Migrations on PostgreSQL
        run: php artisan migrate --force

      - name: Pest on PostgreSQL
        run: php artisan test --compact
