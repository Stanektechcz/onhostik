name: tests

# The Pest suite (feature, contract and unit tests) on every push and pull request.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
# A newer push to the same PR supersedes the older run; pushes to development/main are never cancelled, so a red commit is always reported.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Spectral over the committed contract (ruleset: .spectral.yaml). Errors and warnings fail; waived rules are documented there.
  # The CLI is pinned to an exact version: a floating `@6` let a new release add findings to an unchanged contract (raise it on purpose).
  openapi-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Spectral
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint contracts/openapi/onhost-v1.yaml --ruleset .spectral.yaml --fail-severity=warn

  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, sodium
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: touch .env   # phpunit.xml carries the test environment; the staging template is checked by EnvTemplateTest, not used

      - name: Code style
        run: vendor/bin/pint --test

      - name: Pest
        run: php artisan test --compact

      # the committed contract must be what the routes generate (php artisan onhost:openapi); a deploy never rewrites it
      - name: OpenAPI contract drift
        run: php artisan onhost:openapi --check

      # the per-role manual test sheet is generated from RoleCatalog and the navigations (php artisan onhost:docs:roles)
      - name: Role manual test sheet drift
        run: php artisan onhost:docs:roles --check

      # F6: the baseline may only shrink; the ceiling lives in the script and is lowered when entries are fixed
      - name: Larastan baseline ratchet
        run: php scripts/ci/phpstan-baseline-ratchet.php

      - name: Static analysis (Larastan level 5, baseline = typing debt; new code must pass)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # composer audit runs once, in security.yml (`composer audit --locked`); policy: docs/security/dependency-audit-policy.md

  # The same suite against PostgreSQL 16 — the production database (go-live checklist §1); SQLite habits fail here first.
  # One run took ~25 minutes, so the suite is cut into four shards (Pest's --shard, by test file), each with a database of its own: about
  # 8 minutes each, in parallel. The job named `pest-postgres` below only reports the four, so the check name the branch rules wait for
  # stays the same and one rerun of a failed shard is enough.
  pest-postgres-shard:
    name: pest-postgres shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onhost_test
          POSTGRES_USER: onhost
          POSTGRES_PASSWORD: onhost
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: onhost_test
      DB_USERNAME: onhost
      DB_PASSWORD: onhost
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pgsql, pdo_pgsql, gd, bcmath, sodium
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: touch .env

      - name: Migrations on PostgreSQL
        run: php artisan migrate --force

      - name: Pest on PostgreSQL (shard ${{ matrix.shard }} of 4)
        run: php artisan test --compact --shard=${{ matrix.shard }}/4

  # Staging (and the planned production host) run PHP 8.5, while every other job here pins 8.3 — the lowest version
  # composer.json allows. This job runs the same SQLite suite and the gated deployer A → B → A on PHP 8.5, so a
  # language change (deprecation turned error, removed function) shows up here and not first on the server (J0, TASK-0151).
  php85:
    name: php 8.5 (pest + deployer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, sodium
          coverage: none
          tools: composer

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php85-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php85-${{ runner.os }}-

      - name: Install PHP dependencies (the committed lock, on PHP 8.5)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: touch .env

      - name: Pest on PHP 8.5
        run: php artisan test --compact

      - name: Deployer end to end on PHP 8.5 (A → B → A)
        run: PHP_BIN="$(command -v php)" COMPOSER_BIN="$(command -v composer)" bash infra/aapanel/ci/deploy-e2e.sh "$RUNNER_TEMP/deploy-e2e"

  pest-postgres:
    needs: pest-postgres-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All four PostgreSQL shards passed
        run: |
          echo "shards: ${{ needs.pest-postgres-shard.result }}"
          test "${{ needs.pest-postgres-shard.result }}" = "success"

  # The gated deployer (TASK-0032): syntax, ShellCheck, and a real release A → B → A of this tree through the installed
  # deployer (maintenance mode, composer --no-dev, migrations, config/route/event caches, openapi, backup + verify,
  # doctor gate, HTTP checks through the bypass); only systemctl, chown and the PHP-FPM reload are stubbed.
  # P12 (phase Q): the alert rules are checked and unit-tested by the real promtool, the Alertmanager config by amtool
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Alert rules (promtool check + test) and Alertmanager config (amtool)
        run: bash infra/monitoring/ci/promtool.sh "$RUNNER_TEMP/monitoring"

  # P13 (phase R): the restore drill for real — back up this tree's PostgreSQL with pg_dump, restore the newest set into a
  # throw-away database through infra/aapanel/restore-drill.sh, measure it, drop it, and check the doctor row; an unbalanced
  # ledger must fail the drill and a tampered dump must be refused (infra/aapanel/ci/restore-drill-ci.sh)
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onhost_restore_ci
          POSTGRES_USER: onhost
          POSTGRES_PASSWORD: onhost
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: onhost_restore_ci
      DB_USERNAME: onhost
      DB_PASSWORD: onhost
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pgsql, pdo_pgsql, gd, bcmath, sodium
          coverage: none
          tools: composer

      - name: PostgreSQL client tools (pg_dump, pg_restore, psql)
        run: command -v pg_restore >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Restore drill against a disposable PostgreSQL
        run: bash infra/aapanel/ci/restore-drill-ci.sh "$RUNNER_TEMP/restore-drill"

  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, sodium
          coverage: none
          tools: composer

      - name: Shell syntax
        run: for f in infra/aapanel/*.sh infra/aapanel/ci/*.sh infra/penpot/*.sh infra/penpot/ci/*.sh; do bash -n "$f" || exit 1; done

      - name: ShellCheck (warnings and errors)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck -S warning infra/aapanel/*.sh infra/aapanel/ci/*.sh infra/penpot/*.sh infra/penpot/ci/*.sh

      - name: Deployer end to end (A → B → A)
        run: PHP_BIN="$(command -v php)" COMPOSER_BIN="$(command -v composer)" bash infra/aapanel/ci/deploy-e2e.sh "$RUNNER_TEMP/deploy-e2e"

      # Q4 (TASK-0190, P-R78): the staging spec of the deployer accepts the token switch on, off or unset (ST-6) and nothing else —
      # the real write_expected_env of staging.sh against a staging-like app.env, held by the real deploy-gate.php env-assert
      - name: Deployer spec accepts the operator switches (expected-env)
        run: PHP_BIN="$(command -v php)" bash infra/aapanel/ci/expected-env-switches.sh "$RUNNER_TEMP/expected-env"

      # J2 (TASK-0154): provision-node.sh for real on this throw-away runner, as staging Path A runs it (shared host, Caddy on
      # loopback with local_certs, no docker group): the second run must report 0 changes and the user must stay out of docker
      - name: Penpot node provisioning, real run twice (idempotence)
        run: sudo --preserve-env=CI bash infra/penpot/ci/provision-twice.sh "$RUNNER_TEMP/penpot-node"
