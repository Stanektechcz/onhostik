name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: onhost_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, zip, bcmath, gd, redis
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.ci .env || cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations (SQLite in-memory)
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run PHPStan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Run Pest tests
        run: ./vendor/bin/pest --coverage --min=60
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_KEY: base64:gBtFyJ+5a7V3wCz9EkhLHNrxbGNHJO1RYGHUinXjIpA=
          PROVISIONING_MOCK_MODE: true
          AAPANEL_ALLOW_REAL_WRITES: false
          AI_ALLOW_REAL_CALLS: false

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, xml, zip, bcmath

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPStan analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress --error-format=github

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist
      - name: Audit Composer dependencies
        run: composer audit
