name: security

# What the test workflow does not cover: secrets in the history, the JavaScript supply chain and a weekly
# re-check of advisories published after a change was merged (go-live checklist §1).
on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history, not only the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, sodium
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer advisories (locked versions)
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: npm advisories
        run: npm audit --audit-level=high
      - name: Frontend build
        run: npm run build
