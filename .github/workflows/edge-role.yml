name: ansible-roles

# The Ansible roles (audit §5m-3, §5n-3, §5o-3): lint on every change under infra/ansible, then every role's molecule
# scenario converges in a Debian container — the edge role with Caddy, PowerDNS and the probe for real, Proxmox and
# ISPConfig against stubbed vendor CLIs (pveum, mysql) that record the calls.
on:
  push:
    branches: [main, development]
    paths: ['infra/ansible/**', 'infra/edge/**', '.github/workflows/edge-role.yml']
  pull_request:
    paths: ['infra/ansible/**', 'infra/edge/**', '.github/workflows/edge-role.yml']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ansible-lint
        run: pip install "ansible-lint>=24.2" "ansible-core>=2.16"
      - name: ansible-lint
        working-directory: infra/ansible
        run: ansible-lint --offline -c .ansible-lint

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        role: [onhost_edge, onhost_powerdns, onhost_probe, onhost_proxmox_api, onhost_ispconfig_remote, onhost_node_activate, onhost_clamav]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install molecule
        run: pip install "molecule>=24.2" "molecule-plugins[docker]>=23.5" "ansible-core>=2.16" docker passlib
      - name: Install the collections the roles use
        run: ansible-galaxy collection install community.docker ansible.posix
      - name: molecule test (${{ matrix.role }})
        working-directory: infra/ansible/roles/${{ matrix.role }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
        run: molecule test
