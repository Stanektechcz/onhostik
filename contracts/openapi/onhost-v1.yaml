components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: onhost_session
      description: 'Sanctum SPA session (login via POST /auth/login, CSRF cookie required).'
    bearer:
      type: http
      scheme: bearer
      description: 'Personal/service API token `onh_live_…` with documented scopes (POST /tokens).'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
      description: 'Replay-safe key; the same key returns the stored result within the TTL.'
    Organization:
      name: X-Organization
      in: header
      required: false
      schema:
        type: string
      description: 'Organization context for users that belong to several organizations.'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    Money:
      type: object
      required:
        - minor
        - currency
        - decimal
      properties:
        minor:
          type: integer
          description: 'Amount in minor units (haléře/cents).'
        currency:
          type: string
          enum:
            - CZK
            - EUR
        decimal:
          type: string
          example: '1234.56'
    Problem:
      type: object
      required:
        - error
        - message
        - status
      properties:
        error:
          type: string
          description: 'Machine slug, e.g. step_up_required, access_not_approved, invalid_transition, not_found'
        message:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        requirement:
          type: string
          enum:
            - step_up
            - approval
            - human
    List:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
    Envelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
  headers:
    X-Total-Count:
      schema:
        type: integer
      description: 'Total rows for paginated lists.'
    X-Correlation-Id:
      schema:
        type: string
