; Supervisor konfigurace pro OnHost queue worker
; Umístěte do: /etc/supervisor/conf.d/onhost-queue.conf
; Příkaz: supervisorctl reread && supervisorctl update
;
; Fronty (dle priority):
;   provisioning-high — platební webhooky → okamžitá aktivace
;   default / high    — obecné úlohy
;   provisioning      — provisioning jobs (vytvoření, suspend, unsuspend)
;   low               — méně urgentní
;   provisioning-low  — synchronizace stavu, cleanup

[program:onhost-queue]
process_name=%(program_name)s_%(process_num)02d
command=php8.2 /var/www/onhost/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --queue=provisioning-high,default,high,provisioning,low,provisioning-low
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/onhost-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
