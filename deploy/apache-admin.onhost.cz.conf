# Apache VirtualHost — admin.onhost.cz (produkce)
# Umístěte do: /etc/apache2/sites-available/admin.onhost.cz.conf
# Aktivujte: a2ensite admin.onhost.cz && systemctl reload apache2
#
# DŮLEŽITÉ: admin.onhost.cz je ALIAS na stejnou Laravel aplikaci.
# Admin panel je dostupný na /admin/* — tato subdoména pouze přesměrovává.

<VirtualHost *:80>
    ServerName admin.onhost.cz
    Redirect permanent / https://admin.onhost.cz/
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.onhost.cz

    DocumentRoot /var/www/onhost/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/onhost.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/onhost.cz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Přesměrování / → /admin
    RewriteEngine On
    RewriteRule ^/?$ /admin [R=302,L]

    <Directory /var/www/onhost/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Omezení přístupu na admin.onhost.cz — volitelně omezte na IP office/VPN:
    # <Location /admin>
    #     Require ip 1.2.3.4 5.6.7.8
    # </Location>

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/admin.onhost.cz-error.log
    CustomLog ${APACHE_LOG_DIR}/admin.onhost.cz-access.log combined
</VirtualHost>
