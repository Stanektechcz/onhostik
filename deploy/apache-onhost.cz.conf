# Apache VirtualHost — onhost.cz (produkce)
# Umístěte do: /etc/apache2/sites-available/onhost.cz.conf
# Aktivujte: a2ensite onhost.cz && systemctl reload apache2
#
# Předpokládá: Let's Encrypt certbot (/etc/letsencrypt/live/onhost.cz/)
# PHP: php8.2-fpm (socket /run/php/php8.2-fpm.sock)

<VirtualHost *:80>
    ServerName onhost.cz
    ServerAlias www.onhost.cz
    Redirect permanent / https://onhost.cz/
</VirtualHost>

<VirtualHost *:443>
    ServerName onhost.cz
    ServerAlias www.onhost.cz

    DocumentRoot /var/www/onhost/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/onhost.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/onhost.cz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Rewrite www → bez www
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.onhost\.cz$ [NC]
    RewriteRule ^ https://onhost.cz%{REQUEST_URI} [R=301,L]

    <Directory /var/www/onhost/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM přes FastCGI
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Bezpečnostní hlavičky
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Statické assety — dlouhodobé cache
    <LocationMatch "^/(front|panel)/(css|js|fonts|img|svg)/.*\.(css|js|woff2?|ttf|eot|svg|png|jpg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Log soubory
    ErrorLog  ${APACHE_LOG_DIR}/onhost.cz-error.log
    CustomLog ${APACHE_LOG_DIR}/onhost.cz-access.log combined
</VirtualHost>
