# Development stack for the ONhost control plane (blueprint §32 dev-parity).
# Providers (Proxmox, ISPConfig, aaPanel, Pterodactyl, PowerDNS, WEDOS) are NOT emulated here: point the
# `*_URL` variables at a lab or use the DevInfrastructureSeeder + HTTP fakes from the test suite.
#   docker compose -f infra/docker-compose.yml up -d
services:
  app:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: onhost
      DB_USERNAME: onhost
      DB_PASSWORD: onhost
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      ONHOST_UI_DEMO: "false"
      ONHOST_CONSOLE_RELAY_KEY: dev-relay-key
      ONHOST_CLAMAV_HOST: clamav                       # §5u-1: uploads scanned by the clamd container
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318  # §5u-2: spans to Tempo
      ONHOST_TRACE_URL: 'http://localhost:3000/explore?left=%7B%22datasource%22:%22tempo%22,%22queries%22:%5B%7B%22refId%22:%22A%22,%22queryType%22:%22traceql%22,%22query%22:%22{trace_id}%22%7D%5D%7D'
    ports: ["8000:8000"]
    depends_on: [postgres, redis, mailpit]
    volumes: ["..:/var/www/html"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    environment: { APP_ENV: local, DB_CONNECTION: pgsql, DB_HOST: postgres, DB_DATABASE: onhost, DB_USERNAME: onhost, DB_PASSWORD: onhost, REDIS_HOST: redis, QUEUE_CONNECTION: redis, CACHE_STORE: redis, ONHOST_CLAMAV_HOST: clamav, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    depends_on: [postgres, redis]
    volumes: ["..:/var/www/html"]
    command: ["php", "artisan", "queue:work", "--queue=default,mails,provider-proxmox,provider-ispconfig,provider-aapanel,provider-pterodactyl,provider-powerdns,provider-registrar,provider-kubernetes", "--tries=1", "--timeout=900"]

  scheduler:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    environment: { APP_ENV: local, DB_CONNECTION: pgsql, DB_HOST: postgres, DB_DATABASE: onhost, DB_USERNAME: onhost, DB_PASSWORD: onhost, REDIS_HOST: redis, QUEUE_CONNECTION: redis, CACHE_STORE: redis }
    depends_on: [postgres, redis]
    volumes: ["..:/var/www/html"]
    command: ["php", "artisan", "schedule:work"]

  console-relay:
    build:
      context: ./console-relay
    environment:
      ONHOST_API: http://app:8000
      ONHOST_CONSOLE_RELAY_KEY: dev-relay-key
      ONHOST_CLAMAV_HOST: clamav                       # §5u-1: uploads scanned by the clamd container
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318  # §5u-2: spans to Tempo
      ONHOST_TRACE_URL: 'http://localhost:3000/explore?left=%7B%22datasource%22:%22tempo%22,%22queries%22:%5B%7B%22refId%22:%22A%22,%22queryType%22:%22traceql%22,%22query%22:%22{trace_id}%22%7D%5D%7D'
      PORT: "8090"
    ports: ["8090:8090"]
    depends_on: [app]

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: onhost, POSTGRES_USER: onhost, POSTGRES_PASSWORD: onhost }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/slo-alerts.yml:/etc/prometheus/slo-alerts.yml:ro
    ports: ["9090:9090"]

  clamav: # virus scan of uploads (audit §5u-1); freshclam runs inside the image
    image: clamav/clamav:1.4
    volumes: ["clamdb:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      retries: 5
  alertmanager: # pages and tickets from the Prometheus rules (infra/monitoring/alertmanager.yml)
    image: prom/alertmanager:v0.27.0
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
  otel-collector: # OTLP/HTTP receiver in front of Tempo (audit §5u-2)
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./monitoring/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    depends_on: [tempo]
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./monitoring/tempo.yaml:/etc/tempo.yaml:ro", "tempodata:/var/tempo"]
  grafana: # the console's trace links open Explore here
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/onhost.yaml:ro
      - ./monitoring/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/onhost.yaml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [tempo, prometheus]

volumes:
  pgdata: {}
  redisdata: {}
  clamdb: {}
  tempodata: {}
