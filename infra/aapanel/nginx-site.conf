# ONhost control plane behind aaPanel's nginx — paste into Website → <site> → Config, inside the `server { … }`
# block that aaPanel generated (keep its SSL, log and `include enable-php-85.conf` lines; replace the `root` and
# `location /` parts with these). The website root must be the repository's public/ directory.
#
#   root /www/wwwroot/staging.onhost.cz/public;   # onhost.cz in production
#   index index.php;
#
# Laravel front controller
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# STAGING ONLY (docs/runbooks/staging-launch.md S1) — the whole site behind basic auth, except loopback (the gated
# deployer checks /up and /v1/status on 127.0.0.1 and refuses to start on 401/403), /up and the payment callback;
# never indexed. The realm is a variable decided once per request at server level: a per-location `auth_basic off`
# would not survive the internal redirect to /index.php, and `satisfy any` + `deny all` would answer 403 on /up.
# Password file: `htpasswd -c /www/server/panel/vhost/onhost-staging.htpasswd <user>`. ASSUMED until S1 verifies it.
# The exemption keys on $remote_addr: with a `real_ip_header` / `set_real_ip_from` that trusts a foreign range (a CDN
# setting, 0.0.0.0/0), one `X-Forwarded-For: 127.0.0.1` header skips the password. S1 checks `nginx -T` and both headers.
#
#   add_header X-Robots-Tag "noindex, nofollow" always;
#   set $onhost_auth "ONhost staging";
#   if ($remote_addr = 127.0.0.1) { set $onhost_auth off; }
#   if ($remote_addr = ::1) { set $onhost_auth off; }
#   if ($request_uri ~ "^/(up|v1/webhooks/payments/[a-z0-9_-]+)(\?|$)") { set $onhost_auth off; }
#   auth_basic $onhost_auth;
#   auth_basic_user_file /www/server/panel/vhost/onhost-staging.htpasswd;

# never serve dotfiles or the storage tree
location ~ /\.(?!well-known) { deny all; }
location ^~ /storage/ { deny all; }

# prototype assets and generated scripts are served by the application (cache-busted by version), so no static rule for /surfaces
# websocket console relay (infra/console-relay on :8090): ONHOST_CONSOLE_RELAY_URL=wss://<site>/relay → browsers open /relay/ws/<token>;
# /console/ws/<token> stays with the application (the relay resolves the descriptor there with the shared key)
location /relay/ws/ {
    proxy_pass http://127.0.0.1:8090/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

# uploads: game files (100 MB), site imports (ONHOST_UPLOAD_MAX_BYTES)
client_max_body_size 2048m;

# aaPanel's PHP handler (`include enable-php-85.conf`) already maps *.php to PHP-FPM 8.5; make sure these fastcgi
# parameters are in place in that include or here:
#   fastcgi_param HTTPS on;
#   fastcgi_read_timeout 300;
