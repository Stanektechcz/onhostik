# ONhost control plane behind aaPanel's nginx — paste into Website → onhost.cz → Config, inside the `server { … }`
# block that aaPanel generated (keep its SSL, log and `include enable-php-83.conf` lines; replace the `root` and
# `location /` parts with these). The website root must be the repository's public/ directory.
#
#   root /www/wwwroot/onhost.cz/public;
#   index index.php;
#
# Laravel front controller
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# never serve dotfiles or the storage tree
location ~ /\.(?!well-known) { deny all; }
location ^~ /storage/ { deny all; }

# prototype assets and generated scripts are served by the application (cache-busted by version), so no static rule for /surfaces
# websocket console relay (infra/console-relay on :8090): ONHOST_CONSOLE_RELAY_URL=wss://onhost.cz/relay → browsers open /relay/ws/<token>;
# /console/ws/<token> stays with the application (the relay resolves the descriptor there with the shared key)
location /relay/ws/ {
    proxy_pass http://127.0.0.1:8090/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

# uploads: game files (100 MB), site imports (ONHOST_UPLOAD_MAX_BYTES)
client_max_body_size 2048m;

# aaPanel's PHP handler (`include enable-php-83.conf`) already maps *.php to PHP-FPM 8.3; make sure these fastcgi
# parameters are in place in that include or here:
#   fastcgi_param HTTPS on;
#   fastcgi_read_timeout 300;
