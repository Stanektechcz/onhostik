# SLO alerting rules mirroring config/onhost.php → sla.burn_rate_windows (blueprint §66.5).
# The control plane computes the same windows from external probes (SlaService); these rules cover the
# platform-side SLIs (HTTP success ratio of /v1 and the surfaces) so that both views agree before paging.
groups:
  - name: onhost-slo
    rules:
      - record: onhost:http_error_ratio:5m
        expr: sum(rate(onhost_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(onhost_http_requests_total[5m])), 1)
      - record: onhost:http_error_ratio:30m
        expr: sum(rate(onhost_http_requests_total{status=~"5.."}[30m])) / clamp_min(sum(rate(onhost_http_requests_total[30m])), 1)
      - record: onhost:http_error_ratio:1h
        expr: sum(rate(onhost_http_requests_total{status=~"5.."}[1h])) / clamp_min(sum(rate(onhost_http_requests_total[1h])), 1)
      - record: onhost:http_error_ratio:6h
        expr: sum(rate(onhost_http_requests_total{status=~"5.."}[6h])) / clamp_min(sum(rate(onhost_http_requests_total[6h])), 1)
      - record: onhost:http_error_ratio:3d
        expr: sum(rate(onhost_http_requests_total{status=~"5.."}[3d])) / clamp_min(sum(rate(onhost_http_requests_total[3d])), 1)

      # objective 99.95 % (business class) → error budget 0.0005
      - alert: OnhostBurnRateFast
        expr: onhost:http_error_ratio:5m > (14.4 * 0.0005) and onhost:http_error_ratio:1h > (14.4 * 0.0005)
        for: 2m
        labels: { severity: page, component: portal }
        annotations: { summary: "Fast burn: 2 % of the 30-day error budget in 1 h", runbook: docs/runbooks/incident-response.md }
      - alert: OnhostBurnRateMedium
        expr: onhost:http_error_ratio:30m > (6 * 0.0005) and onhost:http_error_ratio:6h > (6 * 0.0005)
        for: 15m
        labels: { severity: page, component: portal }
        annotations: { summary: "Medium burn: 5 % of the budget in 6 h" }
      - alert: OnhostBurnRateSlow
        expr: onhost:http_error_ratio:6h > (1 * 0.0005) and onhost:http_error_ratio:3d > (1 * 0.0005)
        for: 1h
        labels: { severity: ticket, component: portal }
        annotations: { summary: "Slow burn: budget on track to be exhausted within 30 days" }

  - name: onhost-platform
    rules:
      - alert: OnhostOutboxLag
        expr: onhost_outbox_pending_oldest_seconds > 120
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Outbox relay is behind: customers are not receiving notifications/webhooks" }
      # G7 (TASK-0115): a message the relay gave up on after 10 attempts is never delivered and no longer counts as lag
      - alert: OnhostOutboxDeadLetters
        expr: onhost_outbox_dead_letters > 0
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "{{ $value }} outbox message(s) the relay gave up on — events, notifications or webhooks were never delivered", runbook: docs/runbooks/outbox-dead-letters.md }
      - alert: OnhostOutboxDeadLettersOld
        expr: onhost_outbox_dead_letter_oldest_seconds > 24 * 3600
        labels: { severity: page }
        annotations: { summary: "An outbox dead letter has waited more than a day for a person", runbook: docs/runbooks/outbox-dead-letters.md }
      - alert: OnhostProvisioningDead
        expr: increase(onhost_operations_total{state="DEAD"}[1h]) > 0
        labels: { severity: ticket }
        annotations: { summary: "A provisioning saga exhausted its retries", runbook: docs/runbooks/provisioning-queue.md }
      - alert: OnhostProviderDown
        expr: onhost_provider_health{state="down"} == 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Provider {{ $labels.instance_key }} is down", runbook: docs/runbooks/provider-outage.md }
      - alert: OnhostRegistrarCreditLow
        expr: onhost_registrar_credit_czk < 20000
        labels: { severity: ticket }
        annotations: { summary: "WEDOS credit below reserve — renewals at risk", runbook: docs/runbooks/domains-registrar.md }
      - alert: OnhostBackupStale
        expr: time() - onhost_platform_backup_verified_timestamp > 26 * 3600
        for: 30m
        labels: { severity: page }
        annotations: { summary: "No verified platform backup for 26 h", runbook: docs/runbooks/go-live-checklist.md }
      - alert: OnhostAutomationDead
        expr: onhost_automation_alive == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: "{{ $labels.machine }} heartbeat missing — renewals, provisioning and notifications stop", runbook: docs/runbooks/provisioning-queue.md }
      - alert: OnhostVirusScannerDown
        expr: onhost_virus_scanner_up == 0
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "clamd unreachable — uploads wait for the scan" }
      - alert: OnhostOnCallUnacknowledged
        expr: onhost_oncall_alerts_active{state="escalated"} > 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "An escalated on-call alert is still unacknowledged", runbook: docs/runbooks/incident-response.md }
      - alert: OnhostNobodyOnCall
        expr: onhost_oncall_assigned == 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "The on-call rota has nobody on shift" }
      - alert: OnhostProbesSilent
        expr: time() - onhost_probe_last_seen_timestamp > 600
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "External probe {{ $labels.probe }} has not reported for 10 minutes (monitoring gap, not an outage)" }

  # P12 (phase Q): what the doctor checks by hand, as alerts — each rule has a unit test in slo-alerts.test.yml (promtool test rules,
  # CI job "monitoring"). The scheduler tick and the worker heartbeat are OnhostAutomationDead above (machine="scheduler"|"worker").
  - name: onhost-operations
    rules:
      - alert: OnhostScheduledJobOverdue
        expr: onhost_schedule_last_success_seconds > onhost_schedule_budget_seconds
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Scheduled job {{ $labels.command }} has not succeeded within its budget", runbook: docs/runbooks/day-2-operations.md }
      - alert: OnhostCertificateExpiringSoon
        expr: onhost_certificates_expiring_7d > 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "{{ $value }} managed certificate(s) expire within 7 days and were not renewed", runbook: docs/runbooks/day-2-operations.md }
      - alert: OnhostCertificateExpired
        expr: onhost_certificates_expired > 0
        for: 15m
        labels: { severity: page }
        annotations: { summary: "{{ $value }} managed certificate(s) expired: the sites show a browser warning", runbook: docs/runbooks/day-2-operations.md }
      - alert: OnhostBankImportStale
        expr: onhost_bank_statement_last_line_timestamp > 0 and time() - onhost_bank_statement_last_line_timestamp > 4 * 86400
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "No bank statement line imported for 4 days: transfers are not matched to proforma invoices", runbook: docs/runbooks/day-2-operations.md }
      - alert: OnhostBankLinesUnmatched
        expr: onhost_bank_unmatched_lines > 0
        for: 24h
        labels: { severity: ticket }
        annotations: { summary: "{{ $value }} bank statement line(s) unmatched for a day", runbook: docs/runbooks/billing-dunning.md }
      - alert: OnhostDiskLow
        expr: onhost_disk_free_ratio < 0.2
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Less than 20 % free on the {{ $labels.path }} disk of the control plane", runbook: docs/runbooks/day-2-operations.md }
      - alert: OnhostDiskCritical
        expr: onhost_disk_free_ratio < 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Less than 5 % free on the {{ $labels.path }} disk: backups, uploads and the database stop soon", runbook: docs/runbooks/day-2-operations.md }
