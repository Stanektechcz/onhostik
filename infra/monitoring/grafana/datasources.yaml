# Grafana datasources (audit §5u-2): Tempo with uid `tempo` — ONHOST_TRACE_URL points at its Explore view.
apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
