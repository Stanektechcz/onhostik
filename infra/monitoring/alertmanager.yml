# Alertmanager for the ONhost rules (infra/monitoring/slo-alerts.yml): `page` reaches the on-call pager, `ticket` the
# operations mailbox. Fill the receiver secrets from the same store as ONHOST_ONCALL_* (never commit them).
global:
  resolve_timeout: 5m
route:
  receiver: ops-mail
  group_by: [alertname, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # A3: Watchdog (severity=heartbeat) goes only to the external heartbeat, every minute, never to people
    - matchers: ['severity = heartbeat']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity = page']
      receiver: pager
      repeat_interval: 1h
receivers:
  # A3: the heartbeat URL (Healthchecks.io, Better Stack, ...) is a secret and never in the repo: the operator writes it to
  # /etc/alertmanager/heartbeat.url (0600). Without the file no ping leaves (Alertmanager logs a failed notify) = disabled.
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/heartbeat.url
        send_resolved: false
  - name: pager
    webhook_configs:
      - url: https://onhost.cz/v1/webhooks/alertmanager   # the platform opens one on-call alert per firing rule (and pages through ONHOST_ONCALL_PROVIDER)
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/oncall.token  # ONHOST_ONCALL_INBOUND_SECRET
    # P12 (P-R19, P-R40): a page also reaches the owner by e-mail, in case the platform itself is what is down; address: OP-4
    email_configs:
      - to: provoz@onhost.cz   # replace with the OP-4 address before deploying the monitoring VM (docs/runbooks/monitoring-setup.md)
        from: alerts@onhost.cz
        smarthost: mail.onhost.cz:587
        auth_username: alerts@onhost.cz
        auth_password_file: /etc/alertmanager/smtp.password
        send_resolved: true
  - name: ops-mail
    email_configs:
      - to: provoz@onhost.cz
        from: alerts@onhost.cz
        smarthost: mail.onhost.cz:587
        auth_username: alerts@onhost.cz
        auth_password_file: /etc/alertmanager/smtp.password
        send_resolved: true