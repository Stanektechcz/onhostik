# ONhost edge — the customers' own status hosts (audit §5k-3, packaged §5l-3), nginx flavour.
# Generated by `php artisan onhost:edge:config --format=nginx`; placeholders: {{PORTAL_HOST}}, {{UPSTREAM}}.
#
# nginx has no on-demand ACME of its own: pair this with certbot in webroot mode and a small issuer that calls
# https://{{PORTAL_HOST}}/v1/status/host-check?host=<host> before it requests a certificate (only 200 may be issued).
# The default server passes every unknown host to the portal, which serves the status page for verified hosts and
# answers the portal itself for its own name.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # certbot writes one certificate per verified host into /etc/letsencrypt/live/<host>/ — map them here
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;

    location / {
        proxy_pass         http://{{UPSTREAM}};
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
