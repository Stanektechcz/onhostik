# ONhost edge — the Slovak domain (W6-6, owner decision 2026-10-16), nginx flavour.
# The Slovak public site lives at https://onhost.cz/sk/ on the same domain; onhost.sk only redirects there, permanently (301),
# keeping the path and the query ($request_uri = path + query). The target host is fixed: never $host. The certificate for
# onhost.sk and www.onhost.sk is issued by certbot (webroot /var/www/acme); DNS and deployment are the owner's steps
# (docs/runbooks/sk-cutover.md).

server {
    listen 80;
    listen [::]:80;
    server_name onhost.sk www.onhost.sk;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://onhost.cz/sk$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name onhost.sk www.onhost.sk;

    ssl_certificate     /etc/letsencrypt/live/onhost.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onhost.sk/privkey.pem;

    return 301 https://onhost.cz/sk$request_uri;
}
